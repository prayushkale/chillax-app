[project]
name = "chillax"

[server]
bind = "127.0.0.1"       # localhost only by default
port = 4747
theme = "default"

[tracker]
kind = "local"           # built-in tracker (ADR 0002)

[agents.claude]
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp"]

# [agents.codex]
# command = "codex-acp"

# [agents.gemini]
# command = "gemini"
# args = ["--acp"]

[budget]
max_concurrent_agents = 3
